# Tests on every push and pull request. A tag vX.Y.Z (matching ha-app/config.yaml's version) also publishes:
#   ghcr.io/<owner>/ar-tuner:<version>/latest     Docker Compose image (amd64 + arm64)
#   ghcr.io/<owner>/ar-tuner-<arch>:<version>    Home Assistant App images (amd64, aarch64)
name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - name: App version matches the code
        run: |
          code=$(python -c "import app; print(app.__version__)")
          addon=$(python -c "import yaml; print(yaml.safe_load(open('ha-app/config.yaml'))['version'])")
          test "$code" = "$addon" || { echo "app/__init__.py $code != ha-app/config.yaml $addon"; exit 1; }

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Names
        id: names
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Compose image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/ar-tuner:${{ steps.names.outputs.version }}
            ghcr.io/${{ steps.names.outputs.owner }}/ar-tuner:latest
      - name: App image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.names.outputs.version }}
            BUILD_ARCH=amd64
          tags: ghcr.io/${{ steps.names.outputs.owner }}/ar-tuner-amd64:${{ steps.names.outputs.version }}
      - name: App image (aarch64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.names.outputs.version }}
            BUILD_ARCH=aarch64
          tags: ghcr.io/${{ steps.names.outputs.owner }}/ar-tuner-aarch64:${{ steps.names.outputs.version }}
