<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Assist Request Tuner · Design preview</title>
<style>
  :root { color-scheme:light; --bg:#f5f5f5; --surface:#fff; --text:#212121; --muted:#616161; --line:#ddd; --input-line:#858585; --primary:#006787; --primary-fill:#dff3fc; --success:#036730; --success-fill:#eaf5ed; --warning:#873900; --warning-fill:#fff0e4; --danger:#b30532; --danger-fill:#fff0ef; --focus:#006787; --radius:12px; }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#111; --surface:#1c1c1c; --text:#eee; --muted:#b8b8b8; --line:#414141; --input-line:#909090; --primary:#7bd4fb; --primary-fill:#123844; --success:#93da98; --success-fill:#183123; --warning:#ffbb89; --warning-fill:#3b2519; --danger:#ffb8b6; --danger-fill:#3e1b22; --focus:#7bd4fb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 Roboto,Arial,sans-serif; }
  button,input,select,textarea { font:inherit; }
  button,a,input,select,textarea,summary { -webkit-tap-highlight-color:transparent; }
  button { cursor:pointer; }
  button:disabled { cursor:not-allowed; opacity:.48; }
  button,a,summary { touch-action:manipulation; }
  :focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
  a { color:var(--primary); text-underline-offset:3px; }
  button { min-height:44px; padding:9px 18px; border:1px solid var(--line); border-radius:22px; background:var(--surface); color:var(--primary); font-weight:500; }
  button:hover:not(:disabled) { background:var(--primary-fill); }
  button.primary { background:var(--primary); color:var(--surface); border-color:transparent; }
  :root[data-theme="dark"] button.primary { color:#002e3e; }
  button.primary:hover:not(:disabled) { filter:brightness(.92); background:var(--primary); }
  button.text { border-color:transparent; background:transparent; padding-inline:12px; }
  button.danger { color:var(--danger); }
  .skip { position:absolute; top:-80px; left:16px; padding:8px; background:var(--surface); z-index:20; }
  .skip:focus { top:8px; }
  .preview-bar { background:var(--warning-fill); color:var(--warning); padding:6px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12px; border-bottom:1px solid var(--line); }
  .preview-bar strong { margin-right:10px; font-weight:700; }
  .preview-bar button { min-height:32px; font-size:12px; padding:3px 10px; color:var(--warning); border-color:currentColor; background:transparent; }
  #preview-controls { display:none; padding:12px 24px; border-bottom:1px solid var(--line); background:var(--surface); gap:16px; align-items:end; flex-wrap:wrap; font-size:14px; }
  #preview-controls.open { display:flex; }
  #preview-controls label { display:grid; gap:4px; }
  #preview-controls select { width:auto; min-width:160px; min-height:40px; }
  header { background:var(--surface); border-bottom:1px solid var(--line); }
  .topbar { min-height:64px; padding:8px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand { display:flex; align-items:center; gap:12px; font-size:20px; font-weight:500; }
  .brand svg { width:28px; height:28px; color:var(--primary); }
  .connection { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .status-dot { width:8px; height:8px; background:var(--success); border-radius:50%; display:inline-block; flex-shrink:0; }
  .navigation { display:flex; align-items:center; padding:0 16px; gap:8px; overflow:visible; }
  .navigation>button,.navigation>details>summary { border:0; border-radius:0; background:none; color:var(--muted); padding:12px 16px; min-height:48px; font-size:14px; white-space:nowrap; }
  .navigation>button.active { color:var(--primary); border-bottom:3px solid var(--primary); padding-bottom:9px; font-weight:700; }
  .navigation>button:hover { background:var(--primary-fill); }
  .navigation details { position:relative; margin-left:auto; }
  .navigation summary { cursor:pointer; list-style:none; }
  .navigation summary::-webkit-details-marker { display:none; }
  .menu { position:absolute; top:100%; right:0; width:230px; z-index:5; padding:8px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:0 6px 20px #0002; }
  .menu button { display:block; width:100%; border:0; border-radius:6px; text-align:left; color:var(--text); font-size:14px; }
  main { max-width:752px; padding:28px 16px 40px; margin:auto; }
  .steps { list-style:none; display:flex; margin:0 0 32px; padding:0; color:var(--muted); font-size:12px; }
  .steps li { flex:1; display:flex; gap:8px; align-items:center; position:relative; }
  .steps li:not(:last-child)::after { content:""; height:1px; background:var(--line); flex:1; margin:0 12px 0 4px; }
  .steps span { display:grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--surface); border:1px solid var(--line); font-size:12px; flex-shrink:0; }
  .steps li.current { color:var(--primary); font-weight:700; }
  .steps li.current span { color:var(--surface); background:var(--primary); border-color:var(--primary); }
  :root[data-theme="dark"] .steps li.current span { color:#002e3e; }
  .steps li.complete span { border-color:var(--primary); background:var(--primary-fill); color:var(--primary); }
  h1,h2,h3,p { margin:0; }
  h1 { font-size:24px; line-height:1.35; font-weight:700; margin-bottom:8px; }
  h2 { font-size:18px; line-height:1.4; font-weight:700; margin-bottom:12px; }
  h3 { font-size:16px; line-height:1.5; font-weight:700; }
  p+p { margin-top:12px; }
  .intro { color:var(--muted); margin-bottom:24px; }
  .muted { color:var(--muted); }
  .small { font-size:14px; }
  .tiny { font-size:12px; }
  .section-label { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin:28px 0 12px; }
  .section-label h2 { margin:0; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:24px; margin-bottom:16px; }
  .card.flush { padding:0; overflow:hidden; }
  .subtle { background:var(--primary-fill); border:0; }
  .summary-row { display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .summary-row strong { font-size:24px; }
  .summary-row p { font-size:14px; color:var(--muted); }
  .request { padding:20px 24px; display:grid; grid-template-columns:1fr auto; gap:12px 20px; align-items:center; }
  .request+.request { border-top:1px solid var(--line); }
  .request h3 { margin-bottom:4px; }
  .request p { color:var(--muted); font-size:14px; }
  .request .actions { justify-content:flex-end; gap:0; }
  .badge { display:inline-flex; gap:6px; align-items:center; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:500; background:var(--bg); color:var(--muted); white-space:nowrap; }
  .badge.success { background:var(--success-fill); color:var(--success); }
  .badge.warning { background:var(--warning-fill); color:var(--warning); }
  .badge.info { background:var(--primary-fill); color:var(--primary); }
  .heading-line { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px; }
  .heading-line h2 { margin:0; }
  .quote { border-left:3px solid var(--primary); padding-left:16px; margin:0 0 16px; font-size:20px; line-height:1.5; }
  .meta { display:flex; gap:8px 16px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  .label { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .divider { border:0; border-top:1px solid var(--line); margin:20px 0; }
  details.card { padding:0; }
  details.card>summary { padding:18px 24px; font-size:14px; font-weight:500; cursor:pointer; min-height:56px; }
  details.card>.details-content { padding:0 24px 24px; }
  details summary::marker { color:var(--muted); }
  .back { margin:-8px 0 12px -12px; font-size:14px; }
  .actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .actions.spread { justify-content:space-between; margin-top:24px; }
  .note { display:flex; align-items:flex-start; gap:12px; padding:16px; border-radius:8px; font-size:14px; background:var(--primary-fill); color:var(--primary); margin-bottom:16px; }
  .note>span:first-child { font-weight:700; flex-shrink:0; }
  .note.warning { background:var(--warning-fill); color:var(--warning); }
  .note.error { background:var(--danger-fill); color:var(--danger); }
  .note.success { background:var(--success-fill); color:var(--success); }
  .note p { line-height:1.6; }
  .note button { margin-top:12px; background:var(--surface); }
  .checks { list-style:none; padding:0; margin:0; }
  .checks li { display:flex; align-items:start; gap:12px; padding:8px 0; font-size:14px; }
  .checks li .check { color:var(--success); font-weight:700; }
  .checks li.error .check { color:var(--danger); }
  .examples { padding:0; margin:0; list-style:none; }
  .examples li { padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .examples li:last-child { border:0; padding-bottom:0; }
  .examples li:first-child { padding-top:0; }
  .example-result { display:flex; justify-content:space-between; gap:16px; }
  .change { border-left:3px solid var(--success); background:var(--success-fill); padding:12px 16px; border-radius:0 6px 6px 0; margin-top:12px; }
  .field { display:grid; gap:6px; margin:18px 0; font-size:14px; }
  .field label { font-weight:500; }
  input:not([type=checkbox]),select,textarea { width:100%; min-height:48px; padding:10px 12px; background:var(--surface); border:1px solid var(--input-line); border-radius:6px; color:var(--text); }
  textarea { resize:vertical; line-height:1.6; }
  textarea.code,pre,code { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; background:var(--bg); padding:16px; border-radius:6px; }
  .field-help { font-size:12px; color:var(--muted); }
  .checkbox { display:flex; align-items:flex-start; gap:12px; font-size:14px; cursor:pointer; }
  input[type=checkbox] { width:20px; height:20px; accent-color:var(--primary); flex-shrink:0; margin:3px 0; }
  .result-icon { width:48px; height:48px; display:grid; place-items:center; font-size:24px; border-radius:50%; background:var(--success-fill); color:var(--success); margin-bottom:16px; }
  .result-icon.error { background:var(--danger-fill); color:var(--danger); }
  footer { max-width:752px; margin:0 auto; padding:0 16px 24px; color:var(--muted); font-size:12px; display:flex; justify-content:space-between; gap:16px; }
  .empty { text-align:center; padding:48px 24px; }
  .empty .result-icon { margin:0 auto 16px; }
  .empty p { max-width:450px; margin:auto; color:var(--muted); }
  .empty .actions { justify-content:center; margin-top:24px; }
  .spinner { display:inline-block; border:2px solid var(--line); border-top-color:var(--primary); border-radius:50%; width:18px; height:18px; animation:spin 1s linear infinite; margin-top:3px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media(prefers-reduced-motion:reduce) { .spinner { animation:none; } }
  .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
  .metrics .card { margin:0; padding:20px; }
  .metrics strong { display:block; font-size:28px; line-height:1.3; }
  .metrics span { font-size:12px; color:var(--muted); }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th,td { padding:12px 8px; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-size:12px; font-weight:500; }
  tr:last-child td { border:0; }
  .chart-row { display:grid; grid-template-columns:62px 1fr 56px; gap:12px; align-items:center; font-size:12px; margin:12px 0; }
  .bar { height:14px; display:flex; border-radius:3px; overflow:hidden; background:var(--line); }
  .bar span:first-child { background:var(--primary); }
  .bar span:last-child { background:var(--input-line); }
  dialog { width:min(480px,calc(100% - 32px)); padding:24px; border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--text); }
  dialog::backdrop { background:#0007; }
  dialog .actions { justify-content:flex-end; margin-top:24px; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--surface); padding:12px 20px; border-radius:8px; z-index:20; width:max-content; max-width:calc(100% - 32px); font-size:14px; box-shadow:0 4px 20px #0002; }
  #toast:empty { display:none; }
  #toast button { background:transparent; color:var(--surface); border:0; min-height:32px; margin-left:12px; padding:0 8px; text-decoration:underline; }
  @media(max-width:600px) { .topbar { padding:8px 16px; min-height:60px; } .brand { font-size:18px; gap:8px; } .connection .label-text { display:none; } .navigation { padding:0 4px; gap:0; } .navigation>button,.navigation>details>summary { padding-inline:10px; font-size:12px; } .navigation details { margin-left:auto; } main { padding-top:20px; } .steps { margin-bottom:24px; } .steps li { font-size:0; gap:0; } .steps li.current { font-size:12px; flex:2; gap:8px; } .steps li:not(:last-child)::after { margin-inline:8px; } .card { padding:20px; } .request { grid-template-columns:1fr; padding:20px; gap:8px; } .request .actions { justify-content:flex-start; margin-left:-12px; } .request .actions button.primary { margin-left:auto; } h1 { font-size:24px; } .preview-bar { padding:6px 16px; } .preview-extra { display:none; } .summary-row { align-items:flex-start; gap:16px; } .summary-row button { padding-inline:12px; white-space:nowrap; } .example-result { display:block; } .example-result .badge { margin-top:8px; } .actions.spread { align-items:stretch; } .actions.spread>.primary { width:100%; order:-1; } .metrics { gap:8px; } .metrics .card { padding:14px 10px; } .metrics strong { font-size:24px; } footer { flex-direction:column; gap:4px; } }
</style>
</head>
<body>
<a href="#main" class="skip">Skip to content</a>
<div class="preview-bar"><div><strong>Design preview</strong> Sample data<span class="preview-extra"> · No Home Assistant connection</span></div><button id="preview-toggle" aria-expanded="false" aria-controls="preview-controls">Preview controls</button></div>
<div id="preview-controls">
  <label>Preview state<select id="scenario"><option value="normal">Primary flow</option><option value="empty">No requests yet</option><option value="clear">All caught up</option><option value="offline">Connection lost</option><option value="ai-off">AI not configured</option><option value="ai-error">AI analysis failed</option><option value="blocked">A check failed</option><option value="writer">Config access unavailable</option><option value="device">Device-action consent</option><option value="rollback">Test failed, restored</option><option value="rollback-failed">Restore failed</option><option value="regression">Past request changed</option></select></label>
  <label>Appearance<select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <label>Install type<select id="host"><option value="app">Home Assistant App</option><option value="sidecar">Sidecar container</option></select></label>
  <button id="reset">Reset preview</button>
</div>
<header>
  <div class="topbar"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4v16M12 4v16M19 4v16"/><path d="M2 8h6M9 16h6M16 9h6" stroke-width="4" stroke-linecap="round"/></svg>Assist Request Tuner</div><div class="connection"><span class="status-dot"></span><span class="label-text" id="connection-label">Collecting requests</span></div></div>
  <nav class="navigation" aria-label="Main navigation">
    <button data-nav="fix" class="active" aria-current="page">Fix requests</button><button data-nav="history">History</button><button data-nav="stats">Stats</button><button data-nav="settings">Settings</button>
    <details id="advanced-menu"><summary>Advanced <span aria-hidden="true">⌄</span></summary><div class="menu"><button data-advanced="Requests">Requests</button><button data-advanced="Candidates">Candidates</button><button data-advanced="Intents">Intents</button><button data-advanced="Changes">Changes</button><button data-advanced="Recipes">Recipes</button><button data-advanced="Custom sentences">Custom sentences</button></div></details>
  </nav>
</header>
<main id="main" tabindex="-1"></main>
<footer><span>Checks use the dry-run matcher. No voice commands are executed.</span><span id="host-label">Home Assistant App</span></footer>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-copy"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><div class="actions"><button id="dialog-cancel">Cancel</button><button id="dialog-confirm" class="primary">Confirm</button></div></dialog>
<script>
'use strict';
// DESIGN ARTIFACT ONLY. All data and transitions below are in memory. No fetch,
// sockets, HA endpoints, external assets, persistent storage, or real operations.
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fixtures=[
  {id:0,text:'Kill the lights in the bedroom',count:8,device:'Bedroom speaker',last:'Today, 9:42 PM',cause:'Home Assistant recognizes the bedroom and its lights, but “kill” is not a built-in way to turn them off.',working:'Turn off the lights in the bedroom',title:'Teach Assist another way to turn off lights',kind:'Custom sentence',change:'Add “kill” as another way to say “turn off” for lights.',detail:'Applies to lights in any area. Existing ways to turn off lights stay available.',examples:['Kill the lights in the bedroom','Kill the kitchen lights','Kill the bed light'],patterns:'kill [the] lights in [the] {area}\nkill [the] {area} lights\nkill [the] {name}',intent:'HassTurnOff',action:'Turned off the bedroom lights.',reply:'The bedroom lights are off.',file:'custom_sentences/en/ar_tuner.yaml',builtin:false},
  {id:1,text:'Turn on the playroom lights',count:5,device:'Kitchen speaker',last:'Today, 6:18 PM',cause:'Your area is named “Play Room”. The transcript uses “playroom”, which Home Assistant did not match to that area.',working:'Turn on the lights in the Play Room',title:'Add “playroom” as an area alias',kind:'Area alias',change:'Add the alias “playroom” to Play Room.',detail:'The area keeps its existing name and aliases. Other areas are unchanged.',examples:['Turn on the playroom lights','Turn off the playroom lights'],patterns:'playroom',intent:'HassTurnOn / HassTurnOff',action:'Turned on the Play Room lights.',reply:'The playroom lights are on.',file:'Area registry · Play Room',builtin:true},
  {id:2,text:'What is the thermostat set to',count:3,device:'Living room speaker',last:'Yesterday, 8:05 AM',cause:'Home Assistant can report the current temperature, but this wording asks for the thermostat’s target temperature.',working:'What is the temperature in the living room',title:'Give a spoken thermostat setpoint reply',kind:'Spoken reply',change:'Create an automation that answers with the Living room thermostat’s target temperature.',detail:'Reads the thermostat’s target temperature. It does not change the thermostat.',examples:['What is the thermostat set to','What is the target temperature'],patterns:'what is [the] thermostat set to\nwhat is [the] target temperature',intent:'Voice reply automation',action:'Read the target temperature of Living room thermostat.',reply:'The thermostat is set to 21 degrees.',file:'Voice reply blueprint + new automation',builtin:true}
];
let state={view:'fix',step:1,selected:0,analyzed:false,analyzing:false,scenario:'normal',applied:false,undone:false,ignored:[],checked:true,consent:false,host:'app',examples:null,patterns:null,settingsTab:'ai',test:false,pause:false};
let toastTimer,analysisTimer,applyTimer,dialogAction;
const main=$('#main');
function notify(message,undo){clearTimeout(toastTimer);$('#toast').innerHTML=esc(message)+(undo?' <button id="toast-undo">Undo</button>':'');if(undo)$('#toast-undo').onclick=undo;toastTimer=setTimeout(()=>$('#toast').textContent='',7000);}
function go(view,step){state.view=view;if(step)state.step=step;render();main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function choose(id){state.selected=id;state.analyzed=false;state.analyzing=false;state.examples=null;state.patterns=null;state.checked=true;state.consent=false;go('fix',2);}
function steps(){return '<ol class="steps" aria-label="Fix progress">'+['Choose request','Understand','Review','Result'].map((s,i)=>`<li class="${state.step===i+1?'current':state.step>i+1?'complete':''}" ${state.step===i+1?'aria-current="step"':''}><span aria-hidden="true">${state.step>i+1?'✓':i+1}</span>${s}</li>`).join('')+'</ol>';}
const note=(kind,title,body)=>`<div class="note ${kind}" ${kind==='error'?'role="alert"':''}><span aria-hidden="true">${kind==='success'?'✓':kind==='error'||kind==='warning'?'!':'ⓘ'}</span><div><strong>${title}</strong>${body?`<p>${body}</p>`:''}</div></div>`;
function requestList(){let available=fixtures.filter(x=>!state.ignored.includes(x.id)&&!(state.applied&&!state.undone&&x.id===state.selected));return `${steps()}<h1>Choose a request to improve</h1><p class="intro">Help Assist handle more home requests locally.<br>Start with something your AI assistant answered.</p>
  ${state.scenario==='offline'?note('error','Home Assistant is unavailable.','Showing previously collected requests. Check the connection before applying a fix. <button data-action="settings-connection">Check connection</button>'):''}
  <div class="card summary-row"><div><strong>82%</strong> <span class="small">handled locally</span><p>164 of 200 home requests · Last 30 days</p></div><button class="text" data-nav="stats">View stats <span aria-hidden="true">→</span></button></div>
  <div class="section-label"><h2>Requests to improve <span class="badge">${state.scenario==='empty'||state.scenario==='clear'?0:available.length}</span></h2><span class="tiny muted">Most frequent first</span></div>
  ${['empty','clear'].includes(state.scenario)||!available.length?`<div class="card empty"><div class="result-icon" aria-hidden="true">${state.scenario==='empty'?'…':'✓'}</div><h2>${state.scenario==='empty'?'Waiting for your first requests':'All caught up'}</h2><p>${state.scenario==='empty'?'Use Assist as usual. Home requests that your AI assistant handles will appear here.':'No home requests need a fix right now. New ones will appear as you use Assist.'}</p><div class="actions"><button data-action="settings-collection">Check collection settings</button></div></div>`:`<section class="card flush" aria-label="Requests to improve">${available.map(x=>`<article class="request"><div><h3>“${x.text}”</h3><p>${x.count} times · ${x.device}</p><span class="tiny muted">${x.last}</span></div><div class="actions"><button class="text" data-ignore="${x.id}" aria-label="Ignore ${x.text}">Ignore</button><button data-choose="${x.id}" aria-label="Review request: ${x.text}">Review <span aria-hidden="true">→</span></button></div></article>`).join('')}</section>`}
  <p class="tiny muted">Ignoring a request only removes it from this list. You can restore it below.</p>
  <div class="section-label"><h2>Other AI requests</h2><span class="tiny muted">Not related to your home</span></div><div class="card small"><strong>“Why is the sky blue?”</strong><p class="muted">This is a general question. Your AI assistant is the right place for it.</p></div>
  <details class="card"><summary>Fixed (${state.applied&&!state.undone?1:0}) · Ignored (${state.ignored.length})</summary><div class="details-content small">${state.applied&&!state.undone?`<div class="heading-line"><span>${fixtures[state.selected].title}</span><button data-action="result">View result</button></div>`:''}${state.ignored.map(id=>`<div class="heading-line"><span>“${fixtures[id].text}”</span><button data-restore="${id}" class="text">Restore</button></div>`).join('')||(!state.applied?'<p class="muted">No fixed or ignored requests yet.</p>':'')}</div></details>`;}
function understand(){const f=fixtures[state.selected],ready=f.builtin||state.analyzed;return `${steps()}<button class="text back" data-action="back-list">← Choose another request</button><h1>Understand the request</h1><p class="intro">See what happened, then choose how to improve it.</p>
  <section class="card"><blockquote class="quote">“${f.text}”</blockquote><div class="meta"><span>${f.count} similar requests</span><span>${f.device}</span><span>${f.last}</span></div><hr class="divider"><div class="label">What the AI assistant did</div><p class="small">${f.action}</p><p class="small muted">Reply: “${f.reply}”</p></section>
  <section class="card"><h2>Why it went to the AI</h2><p class="small">${f.cause}</p><hr class="divider"><div class="label">Already works locally${f.id===2?' · a different question':''}</div><p class="small">“${f.working}”</p></section>
  ${state.scenario==='ai-error'?note('error','AI analysis could not finish.','The provider did not respond. Try again, choose a recipe, or write a fix by hand.'):''}
  ${state.analyzing?`<div class="note" role="status"><span class="spinner" aria-hidden="true"></span><div><strong>Looking for a fix…</strong><p>Checking possible phrasings with Home Assistant. Usually takes about a minute.</p></div></div>`:ready?`<div class="section-label"><h2>Suggested fix</h2><span class="badge ${f.builtin?'success':'info'}">${f.builtin?'Built-in check':'AI draft'}</span></div><section class="card"><div class="heading-line"><h3>${f.title}</h3></div><p class="small muted">${f.detail}</p><div class="actions spread"><span class="badge">${f.kind}</span><button class="primary" data-action="review">Review fix <span aria-hidden="true">→</span></button></div></section>`:`<section class="card"><h2>Find a fix</h2><p class="small muted">No ready-made fix was found. AI analysis can propose new wording and check it against Home Assistant.</p>${state.scenario==='ai-off'?note('warning','AI analysis is not set up.','Connect a model in Settings, or use the manual options below.'):''}<div class="actions" style="margin-top:20px"><button class="primary" data-action="analyze" ${state.scenario==='ai-off'?'disabled':''}>Find fixes with AI</button>${state.scenario==='ai-off'?'<button data-action="settings-ai">Set up AI analysis</button>':''}</div><p class="tiny muted" style="margin-top:12px">Uses your saved “Local model” setup · No provider fee configured.<br>Sends this request, the assistant’s response, and exposed area and device names to that model.</p></section>`}
  <div class="actions small"><button class="text" data-action="manual">Write a fix by hand</button><button class="text" data-advanced="Recipes">Use a recipe</button>${ready&&!state.analyzing?'<button class="text" data-action="analyze">Find another fix with AI</button>':''}</div>`;}
function review(){const f=fixtures[state.selected],blocked=['blocked','writer','offline'].includes(state.scenario)||!state.checked,device=state.scenario==='device';const examples=state.examples||f.examples;return `${steps()}<button class="text back" data-action="back-understand">← Back to suggested fixes</button><h1>Review the fix</h1><p class="intro">Check what will change before applying it to Home Assistant.</p>
  <section class="card"><div class="heading-line"><h2>${device?'Add a device-control phrasing':f.title}</h2></div><span class="badge">${f.kind}</span><div class="change"><div class="label">${device?'New behavior':f.id===1?'Alias to add':'What changes'}</div><p class="small">${device?'“Kill the lights in the bedroom” will turn off the bedroom lights when spoken.':f.change}</p></div><p class="small muted" style="margin-top:12px">${f.detail}</p><hr class="divider"><h3 style="margin-bottom:12px">After this, you can say</h3><ul class="examples">${examples.map(x=>`<li>“${esc(x)}”</li>`).join('')}</ul></section>
  ${state.scenario==='writer'?note('warning','Home Assistant’s config folder is unavailable.','This fix can be saved as a draft. Set up config access before applying it. <button data-action="settings-connection">Set up config access</button>'):''}
  ${state.scenario==='offline'?note('error','Cannot connect to Home Assistant.','Your draft is kept. Check the connection and run the checks again. <button data-action="settings-connection">Check connection</button>'):''}
  <section class="card"><div class="heading-line"><h2>Checks</h2><span class="badge ${blocked?'warning':'success'}">${blocked?'Needs attention':'Ready to apply'}</span></div><ul class="checks"><li><span class="check" aria-hidden="true">✓</span><div>${examples.length} examples recognized as intended</div></li><li class="${state.scenario==='blocked'?'error':''}"><span class="check" aria-hidden="true">${state.scenario==='blocked'?'!':'✓'}</span><div>${state.scenario==='blocked'?'This phrasing also matches “turn on the kitchen lights”. Narrow the wording and check again.':'Existing local requests keep their current matches'}</div></li><li><span class="check" aria-hidden="true">✓</span><div>Compared against the last 30 days of requests</div></li></ul><p class="tiny muted" style="margin-top:12px">These checks test recognition. They do not execute voice commands.</p></section>
  <details class="card"><summary>Edit phrasings and test examples</summary><div class="details-content"><div class="field"><label for="phrases">${f.id===1?'Alias':'Phrasings'}</label><textarea id="phrases" class="code" rows="3">${esc(state.patterns||f.patterns)}</textarea><span class="field-help">${f.id===1?'Additional name for Play Room.':'One per line. [Optional words], (this|that) for choices.'}</span></div><div class="field"><label for="examples">Examples to test</label><textarea id="examples" rows="3">${examples.map(esc).join('\n')}</textarea><span class="field-help">One complete request per line.</span></div><button data-action="recheck">Save draft and recheck</button><span id="edit-status" class="small muted" role="status"></span></div></details>
  ${device?`<div class="note warning"><span aria-hidden="true">!</span><div><strong>This fix can control devices.</strong><p>When these phrasings are spoken, the bedroom lights can turn off.</p><label class="checkbox" style="margin-top:12px"><input id="consent" type="checkbox" ${state.consent?'checked':''}><span>I allow this fix to control devices.</span></label></div></div>`:''}
  <div class="actions spread"><button data-action="back-understand">Back</button><button class="primary" id="apply" data-action="apply" ${blocked||device&&!state.consent?'disabled':''}>Apply to Home Assistant</button></div><p class="tiny muted" style="margin:12px 0 24px">${blocked?'Resolve the checks above before applying.':'The examples are checked again after applying. If verification fails, the app attempts to restore the previous configuration.'}</p>
  <details class="card"><summary>Technical details</summary><div class="details-content"><p class="small muted" style="margin-bottom:12px">Change #42 · ${f.kind}<br>${f.file}</p><pre>${esc(f.id===1?'target: Play Room\nalias: playroom':`intent: ${f.intent}\nphrasing:\n  ${f.patterns.split('\n').join('\n  ')}`)}</pre><button class="text" style="margin-top:12px" data-advanced="Changes">Open advanced editor →</button></div></details>`;}
function result(){const f=fixtures[state.selected],failure=['rollback','rollback-failed','regression'].includes(state.scenario);if(failure){const failed=state.scenario==='rollback-failed',lost=state.scenario==='regression';return `${steps()}<div class="result-icon error" aria-hidden="true">!</div><h1>${failed?'The previous configuration could not be restored':lost?'A past request matches differently':'The fix did not pass verification'}</h1><p class="intro">${failed?'Home Assistant may still contain part of this change. Review its current state before trying another fix.':lost?'The fix was applied, but a historical request no longer matches the same way.':'The previous configuration was restored. This request still needs a fix.'}</p>${note(failed?'error':'warning',failed?'Restore failed':lost?'1 changed match':'Change automatically undone',failed?'Connection lost while restoring the custom sentence file. Do not assume the change was removed.':lost?'“Turn on the kitchen lights” now matches the new sentence instead of its previous intent.':'One of the examples was not recognized after applying. No device commands were executed.')}<section class="card"><h2>What was checked</h2><ul class="checks"><li><span class="check">✓</span>“${f.examples[0]}” recognized locally</li><li class="error"><span class="check">!</span>“${f.examples[1]}” ${lost?'changed its match':'was not recognized as intended'}</li></ul></section><div class="actions">${failed?'<button class="primary" data-action="settings-connection">Check connection</button><button data-advanced="Changes">Review current change</button>':lost?'<button class="primary" data-action="undo">Undo this change</button>':'<button class="primary" data-action="back-understand">Try a different fix</button>'}<button data-action="back-list">Back to requests</button></div>`;}
  return `${steps()}<div class="result-icon" aria-hidden="true">${state.undone?'↶':'✓'}</div><h1>${state.undone?'The change was undone':'Home Assistant recognizes these requests locally'}</h1><p class="intro">${state.undone?'The previous configuration was restored. You can try a different fix.':'The fix is applied and the recognition checks passed.'}</p><section class="card"><h2>What changed</h2><p class="small">${state.undone?'Removed this fix: ':''}${f.change}</p><p class="tiny muted" style="margin-top:12px">Change #42 · ${state.undone?'Undone':'Applied just now'}</p></section>${state.undone?'':`<section class="card"><h2>Verified with Home Assistant</h2><ul class="examples">${(state.examples||f.examples).map(x=>`<li class="example-result"><span>“${esc(x)}”</span><span class="badge success">✓ Recognized locally</span></li>`).join('')}</ul>${f.id===2?'<hr class="divider"><div class="label">Sample spoken answer</div><p class="small">“The thermostat is set to 21 degrees.”</p><p class="small muted">Does that answer the question? If it does not, undo the change and try another fix.</p>':''}<p class="tiny muted" style="margin-top:16px">Recognition was tested without executing commands. You can now try these phrases with Assist.</p></section><section class="card"><h2>Also covers ${f.id===0?2:1} other past requests</h2><p class="small">${f.id===0?'“Kill the kitchen lights”<br>“Kill the bed light”':f.id===1?'“Turn off the playroom lights”':'“What is the target temperature”'}</p><p class="tiny muted" style="margin-top:12px">Based on your last 30 days of requests. Future requests can vary.</p></section>`}<div class="actions spread"><button class="primary" data-action="${state.undone?'back-understand':'back-list'}">${state.undone?'Try a different fix':'Fix another request'}</button>${state.undone?'':'<button data-action="undo">Undo this change</button>'}</div>`;}
function history(){return `<h1>History</h1><p class="intro">Every fix, including drafts and changes that were undone.</p>${state.applied?`<section class="card"><div class="heading-line"><h3>${fixtures[state.selected].title}</h3><span class="badge ${state.undone?'':'success'}">${state.undone?'Undone':'Applied'}</span></div><p class="small muted">Just now · Change #42</p><div class="actions" style="margin-top:16px"><button data-action="result">View result</button>${state.undone?'':'<button class="text" data-action="undo">Undo change</button>'}</div></section>`:`<div class="card empty"><h2>No fixes yet</h2><p>Apply your first fix to see what changed and undo it later.</p><div class="actions"><button class="primary" data-nav="fix">Choose a request</button></div></div>`}`;}
function stats(){return `<h1>More requests handled locally</h1><p class="intro">Last 30 days · Test traffic excluded</p><div class="metrics"><div class="card"><strong>82%</strong><span>Home requests local</span></div><div class="card"><strong>164</strong><span>Handled locally</span></div><div class="card"><strong>36</strong><span>Home requests to AI</span></div></div><section class="card"><h2>Local and AI requests</h2><div class="meta"><span>● Home Assistant</span><span>● AI assistant (gray)</span></div>${[['Mon',24,8],['Tue',20,6],['Wed',31,7],['Thu',18,4],['Fri',28,5],['Sat',26,4],['Sun',17,2]].map(([day,l,a])=>`<div class="chart-row"><span>${day}</span><div class="bar" role="img" aria-label="${day}: ${l} local and ${a} AI requests"><span style="width:${l/(l+a)*100}%"></span><span style="width:${a/(l+a)*100}%"></span></div><span>${l} / ${a}</span></div>`).join('')}<p class="tiny muted">Last 7 days shown. Counts include all requests; the percentage above includes home requests only.</p></section><section class="card"><h2>By device</h2><table><thead><tr><th>Device</th><th>Local</th><th>AI</th></tr></thead><tbody><tr><td>Bedroom speaker</td><td>78</td><td>16</td></tr><tr><td>Kitchen speaker</td><td>52</td><td>13</td></tr><tr><td>Living room speaker</td><td>34</td><td>10</td></tr></tbody></table></section><section class="card"><h2>Ignore test traffic</h2><p class="small muted">Keep testing out of your statistics for a limited time.</p>${state.pause?note('warning','Test traffic is being ignored.','30-minute window · Reason: Testing'):''}<div class="actions" style="margin-top:16px"><button data-action="pause">${state.pause?'End ignore window':'Ignore test traffic for 30 minutes'}</button></div></section>`;}
function settings(){return `<h1>Settings</h1><p class="intro">Connections, AI analysis, and what Request Tuner collects.</p><div class="card"><div class="heading-line"><h2>Home Assistant</h2><span class="badge ${state.scenario==='offline'?'warning':'success'}">${state.scenario==='offline'?'Unavailable':'Connected'}</span></div>${state.host==='app'?`<p class="small muted">Managed by the Home Assistant App. Authentication and config folder access are set up automatically.</p>`:`<div class="field"><label for="ha-url">Home Assistant URL</label><input id="ha-url" type="url" value="http://homeassistant.local:8123"><span class="field-help">An address this container can reach.</span></div><div class="field"><label for="ha-token">Access token</label><input id="ha-token" type="password" placeholder="Saved · Leave blank to keep" autocomplete="off"><span class="field-help">Use a long-lived administrator access token. Saved values are not shown.</span></div><div class="field"><label for="config-access">Config folder access</label><select id="config-access"><option>Mounted folder</option><option>SFTP</option><option>None · Draft file-based fixes only</option></select><span class="field-help">Aliases and exposure changes do not need file access.</span></div>`}<div class="actions" style="margin-top:16px"><button data-test="connection">Test connection</button><span class="small muted" id="test-connection" role="status"></span></div></div>
  <details class="card" ${state.settingsTab==='ai'?'open':''}><summary>AI analysis · Optional</summary><div class="details-content"><p class="small muted">Built-in fixes and manual editing work without AI.</p><div class="field"><label for="ai-source">AI source</label><select id="ai-source"><option>Custom OpenAI-compatible API</option><option>Home Assistant’s Local OpenAI LLM</option></select></div><div id="custom-ai"><div class="field"><label for="ai-url">API URL</label><input id="ai-url" type="url" value="http://local-model:1234/v1"><span class="field-help">From: saved settings</span></div><div class="field"><label for="ai-key">API key</label><input id="ai-key" type="password" placeholder="Saved · Leave blank to keep" autocomplete="off"></div><div class="field"><label for="ai-model">Model</label><select id="ai-model"><option>Local model · Tool calling supported</option></select></div></div><div id="ha-ai" hidden><div class="field"><label for="ha-agent">Conversation agent</label><select id="ha-agent"><option>Living room assistant · Local OpenAI LLM</option></select><span class="field-help">Server details come from that agent. Requires config folder access.</span></div></div><div class="field"><label for="budget">Daily budget (USD)</label><input id="budget" type="number" min="0" step="0.01" value="1.00"><span class="field-help">Today: $0.00 · Based on configured model prices.</span></div><div class="actions"><button data-test="ai">Test AI setup</button><span class="small muted" id="test-ai" role="status"></span></div><details style="margin-top:16px"><summary class="small">Saved setups and model options</summary><div class="field"><label for="setup-name">Setup name</label><input id="setup-name" value="Local model"></div><button data-action="save-setup">Save current setup</button><p class="tiny muted" style="margin-top:12px">Reasoning, prices, provider options, and saved setups remain available here in the production design.</p></details><p class="tiny muted" style="margin-top:20px">Analysis sends transcripts, assistant actions and replies, and exposed device and area names to the provider you choose. Nothing is sent until you ask for analysis.</p></div></details>
  <details class="card" ${state.settingsTab==='collection'?'open':''}><summary>Collecting requests</summary><div class="details-content"><div class="field"><label for="pipeline">Pipelines to collect</label><select id="pipeline"><option>All pipelines</option><option>Home assistant only</option></select><span class="field-help">Exclude test pipelines and devices from collection here.</span></div><label class="checkbox"><input type="checkbox" checked><span>Collect requests from the Bedroom speaker</span></label><p class="tiny muted" style="margin-top:16px">Transcripts and results stay in the local database. No audio is stored.</p></div></details>
  <details class="card"><summary>Advanced settings</summary><div class="details-content small"><p>File status, importing external sentence edits, voice reply blueprint maintenance, settings sources, and API / MCP access live here.</p><div class="actions" style="margin-top:16px"><button data-advanced="Custom sentences">Custom sentences</button><button data-action="blueprint">Check blueprint</button></div><p class="tiny muted" style="margin-top:12px">The production screen will keep every existing setting and its source. Secrets remain concealed until explicitly requested.</p></div></details><div class="actions spread"><span class="small muted">Changes apply without a restart.</span><button class="primary" data-action="save-settings">Save settings</button></div>`;}
function advanced(){const title=state.advanced;return `<button class="text back" data-action="back-list">← Back to requests</button><h1>${esc(title)}</h1><p class="intro">Advanced tools remain available without adding steps to the everyday flow.</p>${note('','Design preview','This screen shows the proposed placement. The existing full editor and data views are retained for implementation.')}${title==='Recipes'?`<section class="card"><h2>Spoken thermostat reply</h2><p class="small muted">Answer a question using the target temperature of your thermostat.</p><button style="margin-top:16px" data-action="recipe">Use recipe</button></section>`:title==='Custom sentences'?`<section class="card"><h2>Managed sentence file</h2><p class="small muted">custom_sentences/en/ar_tuner.yaml</p><hr class="divider"><pre>language: en\nintents:\n  HassTurnOff:\n    data:\n      - sentences:\n          - "kill [the] {area} lights"</pre><p class="small muted" style="margin-top:16px">If this file changes outside Request Tuner, show a diff and require import before another file-based fix.</p></section>`:`<section class="card"><h2>${esc(title)} workspace</h2><p class="small muted">Keep filtering, raw records, diagnostics, editing, and links to related requests in this dedicated view. Use the full content width for tables and logs.</p></section>`}`;}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>{const active=b.dataset.nav===state.view;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#connection-label').textContent=state.scenario==='offline'?'Connection lost':'Collecting requests';$('.status-dot').style.background=state.scenario==='offline'?'var(--danger)':'var(--success)';$('#host-label').textContent=state.host==='app'?'Home Assistant App':'Sidecar container';main.innerHTML=state.view==='fix'?[null,requestList,understand,review,result][state.step]():state.view==='history'?history():state.view==='stats'?stats():state.view==='settings'?settings():advanced();bind();}
function openDialog(title,copy,action){$('#dialog-title').textContent=title;$('#dialog-copy').textContent=copy;$('#dialog-confirm').textContent='Undo change';dialogAction=action;$('#dialog').showModal();$('#dialog-cancel').focus();}
function analyze(){state.analyzing=true;state.scenario='normal';$('#scenario').value='normal';render();clearTimeout(analysisTimer);analysisTimer=setTimeout(()=>{state.analyzing=false;state.analyzed=true;if(state.view==='fix'&&state.step===2){render();notify('Example analysis complete. Review the draft before applying.');}},1000);}
function act(action){switch(action){case'back-list':go('fix',1);break;case'back-understand':go('fix',2);break;case'review':state.checked=true;go('fix',3);break;case'analyze':analyze();break;case'manual':state.analyzed=true;go('fix',3);main.querySelector('details').open=true;$('#phrases').focus();break;case'recipe':choose(2);state.analyzed=true;go('fix',3);break;case'apply':if($('#apply').disabled)return;$('#apply').disabled=true;$('#apply').textContent='Applying and checking…';clearTimeout(applyTimer);applyTimer=setTimeout(()=>{state.applied=!['rollback','rollback-failed'].includes(state.scenario);state.undone=false;go('fix',4);},850);break;case'undo':openDialog('Undo this change?','The previous configuration will be restored. These requests may go to your AI assistant again.',()=>{state.undone=true;state.scenario='normal';$('#scenario').value='normal';go('fix',4);notify('Example change undone. No Home Assistant settings were changed.');});break;case'result':go('fix',4);break;case'recheck':{const value=$('#examples').value.trim(),phrases=$('#phrases').value.trim();if(!value||!phrases){const el=!phrases?$('#phrases'):$('#examples');el.setAttribute('aria-invalid','true');el.focus();$('#edit-status').textContent=' Add at least one phrasing and example.';return;}state.examples=value.split('\n').map(s=>s.trim()).filter(Boolean);state.patterns=phrases;state.checked=true;if(state.scenario==='blocked'){state.scenario='normal';$('#scenario').value='normal';}render();notify('Example checks passed. Your draft is ready to review.');break;}case'settings-connection':state.settingsTab='connection';go('settings');break;case'settings-collection':state.settingsTab='collection';go('settings');break;case'settings-ai':state.settingsTab='ai';go('settings');break;case'save-settings':notify('Preview only: settings are not saved.');break;case'save-setup':notify('Preview only: AI setups are not saved.');break;case'blueprint':notify('Example blueprint is up to date.');break;case'pause':state.pause=!state.pause;render();notify(state.pause?'Example test traffic window started.':'Example test traffic window ended.');break;}}
function bind(){main.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav,1));main.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choose)));main.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));main.querySelectorAll('[data-advanced]').forEach(b=>b.onclick=()=>showAdvanced(b.dataset.advanced));main.querySelectorAll('[data-ignore]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.ignore);state.ignored.push(id);render();notify('Request ignored.',()=>{state.ignored=state.ignored.filter(x=>x!==id);render();notify('Request restored.');});});main.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{state.ignored=state.ignored.filter(x=>x!==Number(b.dataset.restore));render();notify('Request restored.');});main.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{$('#test-'+b.dataset.test).textContent='Example connection successful.';});if($('#consent'))$('#consent').onchange=e=>{state.consent=e.target.checked;$('#apply').disabled=!state.consent;};if($('#ai-source'))$('#ai-source').onchange=e=>{$('#custom-ai').hidden=e.target.selectedIndex===1;$('#ha-ai').hidden=e.target.selectedIndex===0;};['#phrases','#examples'].forEach(s=>{if($(s))$(s).oninput=()=>{state.checked=false;$('#apply').disabled=true;$('#edit-status').textContent=' Recheck your edits before applying.';};});}
function showAdvanced(title){$('#advanced-menu').open=false;state.advanced=title;go('advanced');}
document.querySelectorAll('header [data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav,1));document.querySelectorAll('header [data-advanced]').forEach(b=>b.onclick=()=>showAdvanced(b.dataset.advanced));
$('#preview-toggle').onclick=()=>{const open=$('#preview-controls').classList.toggle('open');$('#preview-toggle').setAttribute('aria-expanded',open);};
$('#theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;
$('#host').onchange=e=>{state.host=e.target.value;render();};
$('#scenario').onchange=e=>{clearTimeout(analysisTimer);clearTimeout(applyTimer);state.scenario=e.target.value;state.selected=0;state.applied=false;state.undone=false;state.analyzing=false;state.analyzed=false;state.checked=true;state.consent=false;state.examples=null;state.patterns=null;if(['blocked','writer','device','rollback','rollback-failed','regression'].includes(state.scenario)){state.analyzed=true;go('fix',state.scenario==='regression'?4:3);}else if(['ai-off','ai-error'].includes(state.scenario))go('fix',2);else go('fix',1);};
$('#reset').onclick=()=>{clearTimeout(analysisTimer);clearTimeout(applyTimer);state={...state,view:'fix',step:1,selected:0,analyzed:false,analyzing:false,scenario:'normal',applied:false,undone:false,ignored:[],checked:true,consent:false,examples:null,patterns:null};$('#scenario').value='normal';go('fix',1);notify('Preview reset.');};
$('#dialog-cancel').onclick=()=>$('#dialog').close();$('#dialog-confirm').onclick=()=>{$('#dialog').close();if(dialogAction)dialogAction();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#advanced-menu').open=false;});
render();
</script>
</body>
</html>
